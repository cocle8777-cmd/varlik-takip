<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP notu: connect-src http/https/ws'e açık çünkü Ayarlar > Veri Kaynağı ekranı
      kullanıcının GİRDİĞİ herhangi bir kurumsal API adresine test bağlantısı kurabilmeli
      (bu bilinçli bir tasarım, gevşek bırakılmış bir kısıtlama değil). style-src için
      'unsafe-inline' React'in inline style={{}} kullanımı yüzünden gerekli. script-src
      ise 'self' ile sıkı tutuluyor — enjekte edilmiş/inline script çalışamaz.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Varlık Takip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
